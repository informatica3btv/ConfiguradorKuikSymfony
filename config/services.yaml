parameters:
    gemini.api_key: '%env(GEMINI_API_KEY)%'
    placa.reference: '13180'
    colgador.reference: '61456'
    instalacion.reference: '13406'
    doors.per_plate: 16

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\GeminiImageService:
        arguments:
            $geminiApiKey: '%gemini.api_key%'

    App\Service\BtvApiService:
        arguments:
            $baseUrl:   '%env(BTV_BASE_URL)%'
            $username:  '%env(BTV_USERNAME)%'
            $password:  '%env(BTV_PASSWORD)%'
            # $cache and $logger are autowired automatically

    App\Service\ConfigurationService:
        arguments:
            $placaReference: '%placa.reference%'
            $colgadorReference: '%colgador.reference%'
            $instalacionReference: '%instalacion.reference%'
            $doorsPerPlate: '%doors.per_plate%'
